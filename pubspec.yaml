name: younis_app
description: "Younis application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.2.0

# Routing
  go_router: ^16.0.0

  # Network
  dio: ^5.8.0
  url_launcher: ^6.3.0

  # Video
  youtube_player_flutter: ^9.1.1

  # Connectivity
  connectivity_plus: ^6.1.5

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  # Value equality for states/failures
  equatable: ^2.0.7

  # Localization
  easy_localization: ^3.0.8
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/images/

  fonts:
    - family: Almendra
      fonts:
        - asset: assets/fonts/almendra/Almendra-Regular.ttf
        - asset: assets/fonts/almendra/Almendra-Italic.ttf
          style: italic
        - asset: assets/fonts/almendra/Almendra-Bold.ttf
          weight: 700
        - asset: assets/fonts/almendra/Almendra-BoldItalic.ttf
          weight: 700
          style: italic
